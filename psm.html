<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSM Receiver - Mesin Cetak</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. GAYA VISUAL ANTARMUKA KLASIK (REPLIKA UI MASTER)
           ========================================================================== */
        body { 
            background-color: #c0c0c0;
            font-family: 'Tahoma', 'Arial', sans-serif; 
            font-size: 12px; 
            color: #000; 
            margin: 10px; 
            display: flex;
            justify-content: center;
        }

        .win-form {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            padding: 10px;
            width: 100%;
            max-width: 950px;
        }

        .win-header-text {
            color: #008000; /* Warna Hijau Khas Receiver */
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .win-title-container { display: flex; justify-content: center; margin-bottom: 15px; }

        .win-title-box {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 4px 50px;
            color: #008000;
            font-weight: bold;
            font-size: 14px;
        }

        .win-content {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .win-row { display: flex; gap: 15px; width: 100%; }
        .win-col { flex: 1; display: flex; flex-direction: column; gap: 15px; }

        .win-groupbox {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 15px 10px 10px 10px;
            position: relative;
        }

        .win-legend {
            position: absolute;
            top: -8px;
            left: 10px;
            background-color: #c0c0c0;
            padding: 0 5px;
            color: #000080;
            font-weight: bold;
        }

        /* Area Scanner Spesial */
        .scanner-area {
            width: 100%;
            height: 40px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            background-color: #000;
            color: #00ff66;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 5px 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .scanner-area:focus { outline: none; background-color: #0a110a; }

        .form-row { display: flex; align-items: center; margin-bottom: 6px; }
        .form-label { width: 100px; font-weight: bold; }

        .win-input {
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            padding: 3px 4px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background-color: #ffffff;
            flex: 1;
            box-sizing: border-box;
        }

        .win-btn {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            padding: 4px 20px;
            font-family: 'Tahoma';
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }
        .win-btn:active { border-color: #404040 #ffffff #ffffff #404040; padding: 5px 19px 3px 21px; }

        .table-container {
            height: 180px;
            overflow-y: auto;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #fff;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #c0c0c0; border: 1px solid #808080; padding: 4px; position: sticky; top: 0; }
        td { border: 1px solid #c0c0c0; padding: 4px; font-size: 11px; }
        
        .action-btn { cursor: pointer; padding: 2px 5px; font-weight: bold; }
        .hide-field { display: none !important; }

        /* ==========================================================================
           2. TATA LETAK CETAK PDF PRESISI TINGGI (SAMA PERSIS DENGAN SENDER)
           ========================================================================== */
        #pdf-container { position: absolute; left: -9999px; top: 0; background-color: transparent; }

        .a4-page { width: 210mm; height: 297mm; padding: 6mm; background: white; box-sizing: border-box; display: grid; page-break-after: always; }
        .layout-6 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4mm; }
        .layout-9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3mm; }

        .shelf-talker { font-family: 'Fredoka', sans-serif; color: #000; border: 4px solid #000; box-sizing: border-box; display: flex; flex-direction: column; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        .st-header { border-bottom: 4px solid #000; display: flex; justify-content: space-between; align-items: center; padding: 2mm 3mm; height: 14%; }
        .st-logo { width: 30%; display: flex; align-items: center; }
        .st-logo img { width: 100%; max-height: 18mm; object-fit: contain; object-position: left; }
        .st-psm-title { width: 40%; text-align: center; font-weight: 900; line-height: 1; }
        .st-psm-sub { width: 30%; text-align: right; font-weight: 700; display: flex; flex-direction: column; justify-content: center; }

        .st-body { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; text-align: center; padding: 2mm; }
        .st-item-name { font-weight: 900; text-transform: uppercase; line-height: 1.1; }
        .st-item-desc { font-weight: 700; line-height: 1.1; }
        .st-snk { font-weight: 900; margin-bottom: 1mm; }

        .st-price-box { display: flex; align-items: center; justify-content: center; gap: 2mm; width: 100%; }
        .st-rp { font-weight: 900; margin-top: 4mm; }
        .st-price-numbers { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .st-strike { font-weight: 700; text-decoration: line-through; text-decoration-thickness: 3px; }
        .st-promo-price { font-weight: 900; letter-spacing: -1px; }
        .st-gratis-text { font-weight: 900; line-height: 1.1; text-transform: uppercase; }

        .st-footer { border-top: 4px solid #000; font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; height: 10%; text-transform: uppercase; }

        .layout-6 .st-psm-title { font-size: 32pt; }
        .layout-6 .st-psm-sub { font-size: 10pt; line-height: 1.2; }
        .layout-6 .st-item-name { font-size: 28pt; margin-bottom: 2mm; }
        .layout-6 .st-item-desc { font-size: 14pt; }
        .layout-6 .st-snk { font-size: 20pt; }
        .layout-6 .st-rp { font-size: 22pt; }
        .layout-6 .st-strike { font-size: 18pt; margin-bottom: -1mm; }
        .layout-6 .st-promo-price { font-size: 65pt; line-height: 0.85; }
        .layout-6 .st-gratis-text { font-size: 42pt; }
        .layout-6 .st-footer { font-size: 12pt; }

        .layout-9 .st-psm-title { font-size: 24pt; }
        .layout-9 .st-psm-sub { font-size: 8pt; line-height: 1.2; }
        .layout-9 .st-item-name { font-size: 22pt; margin-bottom: 1mm; }
        .layout-9 .st-item-desc { font-size: 11pt; }
        .layout-9 .st-snk { font-size: 16pt; }
        .layout-9 .st-rp { font-size: 16pt; margin-top: 2mm; }
        .layout-9 .st-strike { font-size: 14pt; margin-bottom: -1mm; }
        .layout-9 .st-promo-price { font-size: 48pt; line-height: 0.85; }
        .layout-9 .st-gratis-text { font-size: 32pt; }
        .layout-9 .st-footer { font-size: 10pt; }
    </style>
</head>
<body>

<div class="win-form">
    <div class="win-header-text"><b>RECEIVER APP - MESIN CETAK PSM</b></div>
    <div class="win-title-container">
        <div class="win-title-box">DATA TRANSFER PROTOCOL</div>
    </div>

    <div class="win-content">
        <div class="win-groupbox" style="background-color: #b0b0b0;">
            <div class="win-legend" style="color: #008000;">SCANNER AREA</div>
            <p style="margin: 0 0 5px 0; font-size: 11px;">Klik kolom di bawah, lalu scan QR Code. Data akan otomatis masuk ke Draf dan kolom kembali bersih.</p>
            <input type="text" id="qrInputScanner" class="scanner-area" placeholder="[ READY TO SCAN ]" autocomplete="off" autofocus>
        </div>

        <div class="win-row">
            <div class="win-col" style="flex: 1.5;">
                <div class="win-groupbox" style="height: 100%;">
                    <div class="win-legend">DRAFT SIAP CETAK</div>
                    <div class="table-container">
                        <table id="draftTable">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Item</th>
                                    <th>Promo/S&K</th>
                                    <th style="width: 50px;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                        <span id="totalItemDisplay" style="font-weight: bold; color: #000080;">Total: 0 Item</span>
                        <button type="button" id="btnClearDraft" class="win-btn" style="color: red;">KOSONGKAN DRAF</button>
                    </div>
                </div>
            </div>

            <div class="win-col" style="flex: 1;">
                <div class="win-groupbox">
                    <div class="win-legend">PENGATURAN CETAK</div>
                    <div class="form-row">
                        <div class="form-label" style="width: 60px;">Periode</div>
                        <select id="auto-periode" class="win-input"></select>
                    </div>
                    <div class="form-row" style="margin-top: 10px; font-weight: bold;">
                        Layout: 
                        <label style="margin-left: 10px;"><input type="radio" name="layoutGrid" value="6" checked> 6 Grid</label>
                        <label style="margin-left: 10px;"><input type="radio" name="layoutGrid" value="9"> 9 Grid</label>
                    </div>
                    <button type="button" id="btnPrint" class="win-btn" style="width: 100%; margin-top: 10px; padding: 10px; font-size: 14px; color: #008000;">
                        <b>CETAK PDF SEKARANG</b>
                    </button>
                </div>

                <div class="win-groupbox hide-field" id="editFormArea" style="background-color: #ffffe0;">
                    <div class="win-legend" style="color: #ff0000;">EDIT DATA MANUAL</div>
                    <input type="hidden" id="editIndex">
                    <div class="form-row">
                        <div class="form-label">Nama Item</div>
                        <input type="text" id="editNama" class="win-input">
                    </div>
                    <div class="form-row">
                        <div class="form-label">H. Promo</div>
                        <input type="number" id="editPromo" class="win-input">
                    </div>
                    <div class="form-row">
                        <div class="form-label">H. Coret</div>
                        <input type="number" id="editCoret" class="win-input">
                    </div>
                    <div style="display: flex; gap: 5px; margin-top: 5px;">
                        <button type="button" id="btnSaveEdit" class="win-btn" style="flex: 1;">SIMPAN</button>
                        <button type="button" id="btnCancelEdit" class="win-btn" style="flex: 1; color: red;">BATAL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="pdf-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    // 1. Inisialisasi Penyimpanan Draf Lokal
    let draftData = [];

    // Jika ada draf tersimpan di memori HP (localStorage), muat ulang
    if (localStorage.getItem('receiverDraftData')) {
        draftData = JSON.parse(localStorage.getItem('receiverDraftData'));
        renderTable();
    }

    // ==========================================================================
    // LOGIKA SCANNER OTOMATIS BERSIH
    // ==========================================================================
    const scannerInput = document.getElementById("qrInputScanner");
    
    // Mendengarkan setiap input. Biasanya scanner akan menekan tombol Enter di akhir scan.
    scannerInput.addEventListener("input", (e) => {
        let val = e.target.value.trim();
        
        // Coba parsing jika string diawali '[' dan diakhiri ']' (format JSON Array)
        if (val.startsWith("[") && val.endsWith("]")) {
            try {
                let parsedData = JSON.parse(val);
                if (Array.isArray(parsedData)) {
                    // Gabungkan data baru ke dalam array draf
                    draftData = draftData.concat(parsedData);
                    
                    // Simpan ke local storage
                    localStorage.setItem('receiverDraftData', JSON.stringify(draftData));
                    
                    // Render tabel
                    renderTable();
                    
                    // OTOMATIS BERSIHKAN KOLOM DALAM HITUNGAN MILIDETIK
                    setTimeout(() => {
                        scannerInput.value = "";
                        scannerInput.focus();
                    }, 50); 
                }
            } catch (err) {
                // Abaikan error jika JSON belum sempurna (sedang diketik manual)
            }
        }
    });

    // Tambahan pengamanan: Jika scanner menekan ENTER tapi event 'input' gagal mem-parsing
    scannerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            let val = e.target.value.trim();
            if (val) {
                try {
                    let parsedData = JSON.parse(val);
                    if (Array.isArray(parsedData)) {
                        draftData = draftData.concat(parsedData);
                        localStorage.setItem('receiverDraftData', JSON.stringify(draftData));
                        renderTable();
                    }
                } catch (err) {
                    alert("Gagal membaca QR! Pastikan format QR adalah JSON.");
                }
                // Selalu bersihkan kolom setiap ditekan Enter
                scannerInput.value = "";
            }
        }
    });


    // ==========================================================================
    // LOGIKA CRUD TABEL DRAFT
    // ==========================================================================
    function renderTable() {
        const tbody = document.querySelector("#draftTable tbody");
        tbody.innerHTML = "";
        
        if (draftData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Draf kosong. Silakan scan QR.</td></tr>`;
            document.getElementById("totalItemDisplay").innerText = `Total: 0 Item`;
            return;
        }

        draftData.forEach((val, index) => {
            const tr = document.createElement("tr");
            let displayInfo = val.tipe === "gratisan" ? `Beli ${val.snk||'-'} Grts ${val.gratisQty}` : `Rp ${val.hargaPromo.toLocaleString('id-ID')}`;

            tr.innerHTML = `
                <td style="text-align:center;">${index + 1}</td>
                <td><b>${val.namaItem}</b><br><span style="font-size:9px; color:#555;">${val.deskripsiItem}</span></td>
                <td>${displayInfo}</td>
                <td style="text-align:center;">
                    <button class="action-btn" onclick="editDraft(${index})">E</button>
                    <button class="action-btn" style="color:red;" onclick="hapusDraft(${index})">X</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        document.getElementById("totalItemDisplay").innerText = `Total: ${draftData.length} Item`;
    }

    // Fungsi Hapus (Delete)
    window.hapusDraft = function(index) {
        if (confirm("Hapus item ini dari draf?")) {
            draftData.splice(index, 1);
            localStorage.setItem('receiverDraftData', JSON.stringify(draftData));
            renderTable();
        }
    };

    // Fungsi Kosongkan Semua
    document.getElementById("btnClearDraft").addEventListener("click", () => {
        if (draftData.length > 0 && confirm("Kosongkan seluruh draf cetak?")) {
            draftData = [];
            localStorage.removeItem('receiverDraftData');
            renderTable();
        }
    });

    // ==========================================================================
    // LOGIKA FITUR EDIT (UPDATE)
    // ==========================================================================
    window.editDraft = function(index) {
        const val = draftData[index];
        document.getElementById("editIndex").value = index;
        document.getElementById("editNama").value = val.namaItem;
        document.getElementById("editPromo").value = val.hargaPromo || 0;
        document.getElementById("editCoret").value = val.hargaCoret || 0;
        
        document.getElementById("editFormArea").classList.remove("hide-field");
        document.getElementById("editNama").focus();
    };

    document.getElementById("btnCancelEdit").addEventListener("click", () => {
        document.getElementById("editFormArea").classList.add("hide-field");
        scannerInput.focus();
    });

    document.getElementById("btnSaveEdit").addEventListener("click", () => {
        const index = document.getElementById("editIndex").value;
        if (index !== "") {
            draftData[index].namaItem = document.getElementById("editNama").value;
            draftData[index].hargaPromo = Number(document.getElementById("editPromo").value);
            draftData[index].hargaCoret = Number(document.getElementById("editCoret").value);
            
            localStorage.setItem('receiverDraftData', JSON.stringify(draftData));
            renderTable();
            document.getElementById("editFormArea").classList.add("hide-field");
            scannerInput.focus();
        }
    });

    // ==========================================================================
    // PENGATURAN PERIODE OTOMATIS
    // ==========================================================================
    function hitungPeriodeOtomatis() {
        const sekarang = new Date();
        const tgl = sekarang.getDate();
        const blnIndex = sekarang.getMonth();
        const thn = sekarang.getFullYear();
        const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const bulanAktif = namaBulan[blnIndex];
        const tglAkhir = new Date(thn, blnIndex + 1, 0).getDate();

        const periodeEl = document.getElementById("auto-periode");
        periodeEl.innerHTML = ""; 

        const daftarPeriode = [
            { nama: "Periode 1", rentang: `01 - 07 ${bulanAktif} ${thn}`, min: 1, max: 7 },
            { nama: "Periode 2", rentang: `08 - 15 ${bulanAktif} ${thn}`, min: 8, max: 15 },
            { nama: "Periode 3", rentang: `16 - 23 ${bulanAktif} ${thn}`, min: 16, max: 23 },
            { nama: "Periode 4", rentang: `24 - ${tglAkhir} ${bulanAktif} ${thn}`, min: 24, max: 31 }
        ];

        daftarPeriode.forEach(p => {
            const option = document.createElement("option");
            option.text = `${p.nama} (${p.rentang})`;
            option.value = `BERLAKU: ${p.rentang}`; 
            if (tgl >= p.min && tgl <= p.max) option.selected = true;
            periodeEl.appendChild(option);
        });
    }

    // ==========================================================================
    // PDF GENERATOR ENGINE
    // ==========================================================================
    function formatHarga(num) {
        return num.toLocaleString('id-ID').replace(/,/g, '.');
    }

    function createCardHTML(val) {
        const dataPeriode = document.getElementById("auto-periode").value;
        let bodyHTML = "";

        if (val.tipe === "reguler" || val.tipe === "bundel") {
            const snkHtml = val.tipe === "bundel" ? `<div class="st-snk">${val.snk}</div>` : '';
            bodyHTML = `
                <div class="st-item-name">${val.namaItem}</div>
                <div class="st-item-desc">${val.deskripsiItem}</div>
                ${snkHtml}
                <div class="st-price-box">
                    <div class="st-rp">Rp.</div>
                    <div class="st-price-numbers">
                        <div class="st-strike">${formatHarga(val.hargaCoret)}</div>
                        <div class="st-promo-price">${formatHarga(val.hargaPromo)}</div>
                    </div>
                </div>
            `;
        } else if (val.tipe === "gratisan") {
            const tkSyarat = val.snk ? val.snk.toUpperCase() : `BELI ${val.gratisQty + 1}`;
            let tBonus = val.gratisNamaItem ? val.gratisNamaItem.toUpperCase() : "GERATIS 1";
            let tGratis = val.gratisNamaItem ? `GRATIS ${val.gratisQty} <br><span style="font-size: 0.6em;">${tBonus}</span>` : `${tkSyarat} <br> GERATIS ${val.gratisQty}`;
            bodyHTML = `<div class="st-item-name">${val.namaItem}</div><div class="st-item-desc">${val.deskripsiItem}</div><div class="st-gratis-text">${tGratis}</div>`;
        }

        return `
            <div class="shelf-talker">
                <div class="st-header">
                    <div class="st-logo"><img src="alfamarthitamputih.png" alt="Logo"></div>
                    <div class="st-psm-title">PSM</div>
                    <div class="st-psm-sub"><div>Promo Spesial</div><div>Mingguan</div></div>
                </div>
                <div class="st-body">${bodyHTML}</div>
                <div class="st-footer">${dataPeriode}</div>
            </div>
        `;
    }

    document.getElementById("btnPrint").addEventListener("click", () => {
        if (draftData.length === 0) return alert("Belum ada data draf yang bisa dicetak!");

        const layoutVal = document.querySelector('input[name="layoutGrid"]:checked').value;
        const mxPage = parseInt(layoutVal);
        const pdfContainer = document.getElementById("pdf-container");
        
        let allPages = "";
        
        for (let i = 0; i < draftData.length; i += mxPage) {
            const chunk = draftData.slice(i, i + mxPage);
            let itemsHTML = chunk.map(val => createCardHTML(val)).join('');
            allPages += `<div class="a4-page layout-${mxPage}">${itemsHTML}</div>`;
        }

        pdfContainer.innerHTML = allPages;

        const sekarang = new Date();
        const fileName = `CETAK_PSM_${sekarang.getDate()}-${sekarang.getMonth()+1}_Waktu${sekarang.getHours()}${sekarang.getMinutes()}.pdf`;
        
        pdfContainer.style.display = 'block';
        pdfContainer.style.position = 'relative'; 
        pdfContainer.style.left = '0';

        const opt = {
            margin:       0,
            filename:     fileName,
            image:        { type: 'jpeg', quality: 1.0 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // Ganti teks tombol menjadi indikator loading
        const btnPrint = document.getElementById("btnPrint");
        const originalText = btnPrint.innerHTML;
        btnPrint.innerHTML = "<b>MEMPROSES PDF...</b>";

        html2pdf().set(opt).from(pdfContainer).save().then(() => {
            pdfContainer.style.position = 'absolute';
            pdfContainer.style.left = '-9999px';
            pdfContainer.style.display = 'none';
            pdfContainer.innerHTML = "";
            btnPrint.innerHTML = originalText;

            setTimeout(() => {
                if (confirm("Berhasil Cetak PDF!\nApakah Anda ingin mengosongkan draf cetak saat ini?")) {
                    draftData = [];
                    localStorage.removeItem('receiverDraftData');
                    renderTable();
                }
                scannerInput.focus();
            }, 800);
        }).catch(err => {
            alert("Error Download: " + err.message);
            btnPrint.innerHTML = originalText;
        });
    });

    // Jalankan init
    hitungPeriodeOtomatis();
</script>
</body>
</html>
